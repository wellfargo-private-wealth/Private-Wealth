name: Keep Supabase Alive

on:
  schedule:
    # Runs automatically at 00:00 UTC every 3 days (well inside the 7-day window)
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase clients table
        run: |
          curl --fail -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/clients?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
